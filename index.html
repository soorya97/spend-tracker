<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vietnam Spends</title>
<meta name="theme-color" content="#0b0d12">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0b0d12; --card:#14171f; --ink:#eef0f6; --mut:#8b93a6; --line:#222632; --soft:#1c202b;
  --pri:#3ccf83; --exp:#ff6b72; --warn:#f0b03a; --sh:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-bottom:calc(110px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h3{margin:0 0 14px;font-size:18px;font-weight:600}
.muted{color:var(--mut)} .small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* header */
.hero{padding:calc(16px + env(safe-area-inset-top)) 16px 4px}
.hero-in{max-width:1000px;margin:auto}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand b{display:block;font-size:17px;font-weight:700}
.brand small{color:var(--mut);font-size:13px}
.pill{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:500;display:inline-flex;gap:7px;align-items:center}
.pill .ico{width:16px;height:16px}
.modes{display:flex;gap:2px;margin:16px 0 8px;background:var(--soft);padding:3px;border-radius:12px}
.modes button{flex:1;border:0;background:none;color:var(--mut);padding:7px 0;border-radius:9px;font-weight:500;font-size:13px}
.modes button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.4);font-weight:600}
.pnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.pnav b{font-size:14px;font-weight:600}
.pnav button{border:1px solid var(--line);background:var(--card);width:32px;height:32px;border-radius:50%;font-size:16px}
.bal{margin:14px 0 0}
.bal small{display:block;color:var(--mut);font-size:13px;font-weight:500}
.bal strong{font-size:40px;font-weight:700;letter-spacing:-1px}
.io{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.io .tag{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:500;background:var(--soft);color:var(--mut)}
.io .tag b{color:var(--ink);font-weight:600}
.io .tag.ok{background:rgba(47,168,106,.12);color:var(--pri)}.io .tag.ok b{color:var(--pri)}
.io .tag.no{background:rgba(214,69,80,.1);color:var(--exp)}.io .tag.no b{color:var(--exp)}

main{max-width:1000px;margin:18px auto 0;padding:0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);padding:18px;margin-bottom:14px}
.card h4{margin:0 0 12px;font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.cols{display:grid;gap:14px}.cols>.card{margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
@media(min-width:760px){.cols{grid-template-columns:1fr 1fr}.cols .wide{grid-column:1/-1}}
.seg{display:flex;background:var(--soft);padding:3px;border-radius:12px;gap:2px}
.seg button{flex:1;border:0;background:none;padding:7px 10px;border-radius:9px;font-weight:500;font-size:13px;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.4);font-weight:600}
.btn{border:0;background:var(--ink);color:var(--card);font-weight:600;padding:11px 18px;border-radius:12px}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.bad{background:none;color:var(--exp)}
.link{border:0;background:none;color:var(--pri);font-weight:600;padding:0;font-size:13px}
.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}

.bub{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.bub.s{width:32px;height:32px}.bub.s .ico{width:18px;height:18px}

.dwrap{position:relative;width:min(220px,66vw);margin:6px auto 14px}
.dwrap svg{width:100%;display:block;transform:rotate(-90deg)}
.dmid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.dmid b{font-size:21px;font-weight:700}.dmid small{color:var(--mut)}
.li,.tx,.wal,.bgc{display:flex;align-items:center;gap:12px;border:0;background:none;width:100%;text-align:left;color:inherit}
.li{padding:10px 2px;border-top:1px solid var(--line)}.li:first-child{border-top:0}
.t{flex:1;min-width:0}.t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t small{color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a{text-align:right;font-weight:600}.a small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.tx{padding:10px 6px;border-radius:12px}.tx:hover{background:var(--soft)}
.dh{display:flex;justify-content:space-between;padding:14px 6px 4px;font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;color:var(--mut)}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
input[type=search],.in{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:11px 14px;outline:0}
.in:focus,input[type=search]:focus{border-color:var(--pri)}
.empty{text-align:center;padding:30px 12px;color:var(--mut)}
.empty .eb{width:54px;height:54px;border-radius:16px;background:var(--soft);display:grid;place-items:center;margin:0 auto 12px}
.empty .eb .ico{width:26px;height:26px}
.empty b{color:var(--ink);display:block}.empty p{margin:4px 0 14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats div{background:var(--soft);border-radius:14px;padding:12px}
.stats small{display:block;color:var(--mut);font-size:12px}.stats b{font-size:16px;font-weight:700}

/* budgets */
.bgc{padding:12px 0;border-top:1px solid var(--line)}.bgc:first-of-type{border-top:0}
.ring{width:64px;height:64px;flex:none;position:relative}
.ring svg{width:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:600}
.bgc .t div{color:var(--mut);font-size:13px}
.over{color:var(--exp)!important;font-weight:600}
.strip{display:flex;gap:14px;overflow-x:auto;margin:0 -14px 6px;padding:2px 14px 12px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.sb{flex:none;width:80px;border:0;background:none;text-align:center;padding:0;color:var(--ink)}
.sb .r{position:relative;width:62px;height:62px;margin:0 auto 6px}
.sb svg.rg{width:100%;transform:rotate(-90deg)}
.sb .r span{position:absolute;inset:10px;border-radius:50%;display:grid;place-items:center}
.sb .r .ico{width:20px;height:20px}
.sb b{display:block;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb small{font-size:11px;color:var(--mut)}
.trend{display:flex;align-items:flex-end;gap:3px;height:140px}
.trend i{flex:1;background:var(--pri);border-radius:4px 4px 1px 1px;min-height:3px}
.trend i.z{background:var(--line)}.trend i.td{background:var(--ink)}
.tl{display:flex;gap:3px;margin-top:6px;font-size:10px;color:var(--mut)}.tl span{flex:1;text-align:center;overflow:hidden}

/* nav */
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(440px,calc(100% - 24px));background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:26px;box-shadow:0 10px 30px rgba(0,0,0,.5);display:flex;justify-content:space-around;align-items:center;padding:6px;z-index:20}
nav button{border:0;background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:500;padding:6px 8px;flex:1}
nav button.on{color:var(--ink);font-weight:600}nav button.on .ico{stroke:var(--pri)}
nav .fab{flex:none;width:54px;height:54px;border-radius:50%;background:var(--ink);color:var(--card);margin:-24px 4px 0;padding:0;justify-content:center;box-shadow:0 8px 22px rgba(16,24,40,.28)}
nav .fab .ico{width:26px;height:26px;stroke:var(--card)!important;stroke-width:2.2}
@media(min-width:900px){
  body{padding-left:96px;padding-bottom:40px}
  nav{top:0;bottom:0;left:0;transform:none;width:96px;border-radius:0;border:0;border-right:1px solid var(--line);background:var(--card);box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;flex-direction:column;justify-content:flex-start;gap:6px;padding:24px 8px}
  nav button{flex:none;width:100%;padding:12px 4px;border-radius:12px}nav button:hover{background:var(--soft)}
  nav .fab{order:-1;margin:0 0 14px;width:52px;height:52px;border-radius:50%}
  .hero{padding-top:28px}
}

/* dialog */
dialog{border:0;border-radius:22px;padding:0;width:calc(100% - 20px);max-width:460px;background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.65)}
.sheet{padding:20px}
.f{display:block;margin:0 0 12px;font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.f .in{margin-top:5px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink)}
.amt{display:flex;align-items:center;gap:6px;justify-content:center;margin:14px 0 2px}
.amt span{font-size:28px;font-weight:600;color:var(--mut)}
.amt input{border:0;background:none;outline:0;font-size:42px;font-weight:700;width:100%;max-width:280px;text-align:center;padding:0}
.hint{text-align:center;color:var(--mut);font-size:13px;min-height:20px;margin-bottom:12px}
.cg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;max-height:200px;overflow:auto;margin-bottom:12px;padding:2px}
.cg button{border:1.5px solid transparent;background:none;border-radius:14px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:500;color:var(--ink)}
.cg button.on{border-color:var(--ink);background:var(--soft)}
.cg button span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.sw button{width:30px;height:30px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1.5px transparent}
.sw button.on{box-shadow:0 0 0 1.5px var(--ink)}
.em{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.em button{width:42px;height:42px;border-radius:12px;border:1.5px solid transparent;background:var(--soft);display:grid;place-items:center;color:var(--ink)}
.em button.on{border-color:var(--ink)}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.g2 .in{min-width:0}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;font-weight:500;z-index:60}
.wal{padding:11px 0;border-top:1px solid var(--line)}.wal:first-child{border-top:0}

/* mobile polish */
html,body{overflow-x:hidden}
main,.cols>*,.card,.stack>*{min-width:0}
input,select,textarea{font-size:16px}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:12px 6px;overflow:visible;margin:0 0 14px;padding:0}
.sb{width:auto}
.io{gap:6px}
.stats{gap:8px}.stats div{padding:10px}.stats b{font-size:15px}
.li,.tx,.wal,.bgc,.chip,.seg button,.modes button{min-height:44px}
.chip{min-height:36px}
@media(max-width:640px){
  .hero{padding-left:14px;padding-right:14px}
  .bal strong{font-size:34px}
  .card{padding:14px;border-radius:16px}
  main{padding:0 12px}
  .stats small{font-size:11px}
  dialog{width:100%;max-width:none;margin:auto 0 0;border-radius:22px 22px 0 0;max-height:92vh;overflow:auto;animation:up .22s ease-out}
  .sheet{padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
  .cg{max-height:230px;grid-template-columns:repeat(3,minmax(0,1fr));overflow-x:hidden}
  .amt input{font-size:40px}
}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
</style>
</head>
<body>
<header class="hero"><div class="hero-in">
  <div class="bar">
    <div class="brand"><b>Vietnam trip</b><small id="trip"></small></div>
    <button class="pill" id="sy" hidden></button>
  </div>
  <div class="modes" id="modes"></div>
  <div class="pnav" id="pn"><button id="pv" aria-label="Previous">‹</button><b id="pl"></b><button id="nx" aria-label="Next">›</button></div>
  <div class="bal"><small id="bl">Total spent</small><strong class="num" id="bv"></strong></div>
  <div class="io" id="io"></div>
</div></header>
<main id="v"></main>
<nav id="nav"></nav>
<dialog id="dlg"></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
"use strict";
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const pdate = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const monStart = d => addDays(d, -((d.getDay() + 6) % 7));
const diffDays = (a, b) => Math.round((pdate(b) - pdate(a)) / 864e5);
const uid = () => "vn_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
let toastT;
function toast(m) { document.querySelectorAll(".toast").forEach(e => e.remove()); const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.append(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2600); }
const IC = {
  pie: '<path d="M21.2 15.9A10 10 0 1 1 8 2.8"/><path d="M22 12A10 10 0 0 0 12 2v10z"/>',
  list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  target: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
  wallet: '<path d="M20 12V8H6a2 2 0 0 1 0-4h12v4"/><path d="M4 6v12a2 2 0 0 0 2 2h14v-4"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  food: '<path d="M3 2v7a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6a2 2 0 0 0 2 2h3zm0 0v7"/>',
  coffee: '<path d="M17 8h1a4 4 0 0 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4z"/><path d="M6 2v2M10 2v2M14 2v2"/>',
  groc: '<circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2 2h2l2.7 12.4a2 2 0 0 0 2 1.6h9.8a2 2 0 0 0 2-1.6L22 7H5"/>',
  car: '<path d="M19 17h2a1 1 0 0 0 1-1v-3a2 2 0 0 0-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5a1 1 0 0 0-.9.6l-1.4 2.9A3.7 3.7 0 0 0 2 12v4a1 1 0 0 0 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/>',
  bed: '<path d="M2 4v16"/><path d="M2 8h18a2 2 0 0 1 2 2v10"/><path d="M2 17h20"/><path d="M6 8v9"/>',
  ticket: '<path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2z"/><path d="M13 5v2M13 17v2M13 11v2"/>',
  bag: '<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>',
  plane: '<path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>',
  phone: '<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/>',
  health: '<rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8"/>',
  gift: '<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/>',
  dots: '<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
  cash: '<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/>',
  card: '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',
  bank: '<path d="M3 21h18M5 21V10M9 21V10M15 21V10M19 21V10M2 10l10-7 10 7"/>'
};
const ico = n => `<svg viewBox="0 0 24 24" class="ico">${IC[n] || IC.dots}</svg>`;
const bub = (c, s) => `<span class="bub ${s ? "s" : ""}" style="background:${esc(c.color)}1f;color:${esc(c.color)}">${ico(c.icon)}</span>`;

/* ---------- state ---------- */
const KEY = "vn-spend-v1";
const DEFSET = { rate: 272.98, start: "2026-12-04", end: "2026-12-18" };
const DEFC = [
  ["food", "food", "Food & Dining", "#e8744f"], ["coffee", "coffee", "Coffee & Drinks", "#a67c52"], ["groc", "groc", "Groceries", "#3fa37a"],
  ["trans", "car", "Transport", "#3b82c4"], ["stay", "bed", "Stay", "#7b6cd9"], ["act", "ticket", "Activities & Tours", "#d9822b"],
  ["shop", "bag", "Shopping", "#c75b9b"], ["fly", "plane", "Flights", "#2a9da8"], ["sim", "phone", "SIM, Visa & Fees", "#5b6b8c"],
  ["health", "health", "Health", "#d6485b"], ["gift", "gift", "Gifts & Souvenirs", "#d95f76"], ["other", "dots", "Other", "#7c8494"]
];
const COLS = { wallets: "vn_wallet", cats: "vn_cat", txns: "vn_txn", budgets: "vn_budget" };
const KIND2COL = Object.fromEntries(Object.entries(COLS).map(([c, k]) => [k, c]));
const SETID = "vn_settings";
const stable = v => v && typeof v === "object"
  ? (Array.isArray(v) ? "[" + v.map(stable).join(",") + "]" : "{" + Object.keys(v).sort().map(k => JSON.stringify(k) + ":" + stable(v[k])).join(",") + "}")
  : JSON.stringify(v);
const hashOf = o => { const { u, ...rest } = o; return stable(rest); };
function fresh() {
  const s = {
    settings: { ...DEFSET, u: 0 },
    wallets: [
      { id: "vn_wallet_cash", name: "Cash", icon: "cash", color: "#3fa37a", u: 0 },
      { id: "vn_wallet_card", name: "Credit card", icon: "card", color: "#3b82c4", u: 0 },
      { id: "vn_wallet_upi", name: "UPI / Bank", icon: "bank", color: "#7b6cd9", u: 0 }
    ],

    if (drop.size) for (const c of Object.keys(COLS)) S[c] = S[c].filter(x => !drop.has(x.id));

  const col = pct > 1 ? "var(--exp)" : pct > .75 ? "var(--warn)" : "var(--pri)";
  const sub = b.cats?.length ? b.cats.map(id => cat(id).name).slice(0, 3).join(", ") + (b.cats.length > 3 ? ` +${b.cats.length - 3}` : "") : "All expenses";
  return `<button class="bgc" data-bedit="${esc(b.id)}"><div class="ring"><svg viewBox="0 0 42 42"><circle cx="21" cy="21" r="16" fill="none" stroke="var(--soft)" stroke-width="4"/><circle cx="21" cy="21" r="16" fill="none" stroke="${col}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${Math.min(pct, 1) * 100.5} 100.5"/></svg><b class="num">${Math.round(pct * 100)}%</b></div>
    <div class="t"><b>${esc(b.name)}</b><div class="${left < 0 ? "over" : ""} num">${left < 0 ? money(-left) + " over" : money(left) + " left"} <span class="muted">of ${money(b.amount)}</span></div>
    <div>${esc(sub)}${left > 0 && days ? ` · ${money(left / days)}/day for ${days} day${days === 1 ? "" : "s"}` : ""}</div></div></button>`;
}
function vBudgets() {
  const rows = S.budgets.map(b => ({ b, ...bstat(b) }));
  return `<section class="card" style="max-width:760px;margin:auto"><h4>Budgets <button class="link" data-addb="1">+ New budget</button></h4>${rows.length ? rows.map(budgetRow).join("")
    : emptyBox("target", "No budgets yet", "Set a total trip budget, or a limit for food, transport and more.", `<button class="btn" data-addb="1">Create a budget</button>`)}</section>`;
}

/* more */
function vMore() {
  const m = UI.more, seg = `<div class="seg" style="margin-bottom:14px">${[["wallets", "Payments"], ["cats", "Categories"], ["set", "Settings"]].map(([k, l]) => `<button data-mo="${k}" class="${m === k ? "on" : ""}">${l}</button>`).join("")}</div>`;
  let body = "";
  if (m === "wallets") {
    body = `<h4>Payment methods <button class="link" data-addw="1">+ Add</button></h4>` + S.wallets.map(w => { const l = S.txns.filter(t => t.wallet === w.id); return `<button class="wal" data-wedit="${esc(w.id)}">${bub(w)}<span class="t"><b>${esc(w.name)}</b><small>${l.length} expense${l.length === 1 ? "" : "s"}</small></span><b class="num">${money(sumInr(l))}</b></button>`; }).join("");
  } else if (m === "cats") {
    body = `<h4>Categories <button class="link" data-addc="1">+ Add</button></h4>` + S.cats.map(c => { const n = S.txns.filter(t => t.cat === c.id).length; return `<button class="wal" data-cedit="${esc(c.id)}">${bub(c)}<span class="t"><b>${esc(c.name)}</b><small>${n} expense${n === 1 ? "" : "s"}</small></span><span class="muted">›</span></button>`; }).join("");
  } else {
    body = `<div class="g2"><label class="f">Trip start<input class="in" type="date" id="st" value="${esc(S.settings.start)}"></label><label class="f">Trip end<input class="in" type="date" id="en" value="${esc(S.settings.end)}"></label></div>
      <label class="f">Exchange rate (₫ per ₹1)<input class="in" id="rt" type="number" step="any" min="1" value="${esc(S.settings.rate)}"></label>
      <p class="muted small" style="margin-top:-6px">You enter rupees; the ₫ equivalent is calculated automatically at this rate (1 ₹ = this many ₫) and shown in small text.</p>
      <h4 style="margin-top:18px">Cloud sync</h4><p class="muted small">${sb ? (cloud.user ? "Signed in as " + esc(cloud.user.email) + "." : "Not signed in — data is saved on this device only.") : "Cloud sync is not configured."}</p>
      ${sb ? `<button class="btn" id="cs">${cloud.user ? "Sync settings" : "Sign in to sync"}</button>` : ""}`;
  }
  return `<section class="card" style="max-width:760px;margin:auto">${seg}${body}</section>`;
}

/* ---------- events ---------- */
function bind(root) {
  root.onclick = e => {
    const g = s => e.target.closest(s); let x;
    if (g("[data-add]")) return txnDialog();
    if (x = g("[data-edit]")) return txnDialog(S.txns.find(t => t.id === x.dataset.edit));
    if (x = g("[data-cat]")) { UI.fcat = x.dataset.cat; UI.tab = "txns"; render(); return scrollTo(0, 0); }
    if (x = g("[data-go]")) { UI.tab = x.dataset.go; render(); return scrollTo(0, 0); }
    if (g("[data-ft-clear]")) { UI.fcat = ""; return render(); }
    if (g("[data-addb]")) return budgetDialog();
    if (x = g("[data-bedit]")) return budgetDialog(S.budgets.find(b => b.id === x.dataset.bedit));
    if (x = g("[data-mo]")) { UI.more = x.dataset.mo; return render(); }
    if (g("[data-addw]")) return walletDialog();
    if (x = g("[data-wedit]")) return walletDialog(S.wallets.find(w => w.id === x.dataset.wedit));
    if (g("[data-addc]")) return catDialog();
    if (x = g("[data-cedit]")) return catDialog(S.cats.find(c => c.id === x.dataset.cedit));
    if (g("#cs")) return cloudDialog();
  };
  const q = $("#q", root); if (q) q.oninput = () => { UI.q = q.value; const pos = q.selectionStart; render(); const n = $("#q"); n.focus(); n.setSelectionRange(pos, pos); };
  const st = $("#st", root); if (st) { st.onchange = () => { S.settings.start = st.value; save(); chrome(); }; $("#en").onchange = e => { S.settings.end = e.target.value; save(); chrome(); }; $("#rt").onchange = e => { S.settings.rate = parseFloat(e.target.value) || 272.98; save(); chrome(); }; }
}

/* ---------- dialogs ---------- */
const CATICONS = ["food", "coffee", "groc", "car", "bed", "ticket", "bag", "plane", "phone", "health", "gift", "dots"];
const WALICONS = ["cash", "card", "bank", "phone"];
const COLORS = ["#e8744f", "#a67c52", "#d9822b", "#3fa37a", "#2a9da8", "#3b82c4", "#7b6cd9", "#c75b9b", "#d6485b", "#5b6b8c", "#7c8494"];
let lastWallet = null;
try { lastWallet = localStorage.getItem(KEY + "-lw"); } catch {}
const footer = (edit, label = "Save") => `<div class="row between"><span>${edit ? `<button type="button" class="btn bad" id="del">Delete</button>` : ""}</span><span class="row"><button type="button" class="btn ghost" id="x">Cancel</button><button class="btn">${label}</button></span></div>`;

function txnDialog(t) {
  const edit = !!t;
  if (!S.cats.length || !S.wallets.length) { toast("Add a category and payment method first"); UI.tab = "more"; return render(); }
  t = t ? { ...t } : { amount: "", cat: "", wallet: S.wallets.some(w => w.id === lastWallet) ? lastWallet : S.wallets[0].id, date: dstr(new Date()), note: "" };
  let c = t.cat;
  const d = sheet(`<form><div class="amt"><span>₹</span><input id="am" inputmode="decimal" placeholder="0" autocomplete="off" value="${esc(t.amount)}"></div><div class="hint" id="eq"></div>
    <div class="f">Category</div><div class="cg" id="cg"></div>
    <div class="g2"><label class="f">Paid with<select class="in" id="wa">${S.wallets.map(w => `<option value="${esc(w.id)}" ${w.id === t.wallet ? "selected" : ""}>${esc(w.name)}</option>`).join("")}</select></label>
    <label class="f">Date<input class="in" type="date" id="dt" value="${esc(t.date)}"></label></div>
    <label class="f">Note<input class="in" id="nt" placeholder="Optional" value="${esc(t.note || "")}"></label>${footer(edit)}</form>`);
  const val = () => parseFloat(String($("#am").value).replace(/,/g, "")) || 0;
  const hint = () => { const v = val(); $("#eq").textContent = v ? `≈ ${vnd(v * rate())}` : "Enter amount in rupees"; };
    const drawCats = () => { $("#cg").innerHTML = S.cats.map(x => `<button type="button" data-c="${esc(x.id)}" class="${x.id === c ? "on" : ""}">${bub(x, 1)}<span>${esc(x.name)}</span></button>`).join(""); };
  hint(); drawCats();
  $("#cg").onclick = e => { const b = e.target.closest("[data-c]"); if (b) { c = b.dataset.c; drawCats(); } };
  $("#am").oninput = hint;
  $("#x", d).onclick = () => d.close();
  if (edit) $("#del", d).onclick = () => { if (confirm("Delete this expense?")) { S.txns = S.txns.filter(x => x.id !== t.id); save(); d.close(); render(); toast("Deleted"); } };
  $("form", d).onsubmit = e => {
    e.preventDefault();
    const amount = Math.round(val() * 100) / 100;
    if (!(amount > 0)) { toast("Enter an amount"); return $("#am").focus(); }
    if (!c) return toast("Pick a category");
    const o = { id: t.id || uid(), amount, cat: c, wallet: $("#wa").value, date: $("#dt").value || dstr(new Date()), note: $("#nt").value.trim(), c: t.c || Date.now() };
    if (edit) { const i = S.txns.findIndex(x => x.id === t.id); S.txns[i] = { ...S.txns[i], ...o }; } else S.txns.push(o);
    lastWallet = o.wallet; try { localStorage.setItem(KEY + "-lw", lastWallet); } catch {}
    save(); d.close(); render(); toast(edit ? "Saved" : "Expense added");
  };
  d.showModal();
  if (!edit) setTimeout(() => $("#am").focus(), 50);
}

function itemDialog(title, o, edit, icons, onSave, onDel, extraFields = "") {
  const d = sheet(`<form><h3>${title}</h3><label class="f">Name<input class="in" id="n" required value="${esc(o.name)}"></label>${extraFields}
    <div class="f">Icon</div><div class="em" id="em"></div><div class="f">Colour</div><div class="sw" id="sw"></div>${footer(edit)}</form>`);
  const draw = () => { $("#em").innerHTML = icons.map(e => `<button type="button" data-e="${e}" class="${e === o.icon ? "on" : ""}">${ico(e)}</button>`).join(""); $("#sw").innerHTML = COLORS.map(x => `<button type="button" data-c="${x}" style="background:${x}" class="${x === o.color ? "on" : ""}"></button>`).join(""); };
  draw();
  d.onclick = e => { const a = e.target.closest("[data-e]"), b = e.target.closest("[data-c]"); if (a) { o.icon = a.dataset.e; draw(); } else if (b) { o.color = b.dataset.c; draw(); } else if (e.target === d) d.close(); };
  $("#x", d).onclick = () => d.close();
  if (edit) $("#del", d).onclick = () => onDel(d);
  $("form", d).onsubmit = e => { e.preventDefault(); o.name = $("#n").value.trim(); onSave(o); save(); d.close(); render(); };
  d.showModal();
}
function walletDialog(w) {
  const edit = !!w; w = w ? { ...w } : { id: uid(), name: "", icon: "card", color: "#3b82c4" };
  itemDialog(edit ? "Edit payment method" : "New payment method", w, edit, WALICONS,
    o => { if (edit) { const i = S.wallets.findIndex(x => x.id === o.id); S.wallets[i] = { ...S.wallets[i], ...o }; } else S.wallets.push(o); },
    d => { if (S.txns.some(t => t.wallet === w.id)) return toast("Move or delete its expenses first"); if (confirm(`Delete "${w.name}"?`)) { S.wallets = S.wallets.filter(x => x.id !== w.id); if (UI.wallet === w.id) UI.wallet = "all"; save(); d.close(); render(); } });
}
function catDialog(c) {
  const edit = !!c; c = c ? { ...c } : { id: uid(), name: "", icon: "dots", color: "#5b6b8c" };
  itemDialog(edit ? "Edit category" : "New category", c, edit, CATICONS,
    o => { if (edit) { const i = S.cats.findIndex(x => x.id === o.id); S.cats[i] = { ...S.cats[i], ...o }; } else S.cats.push(o); },
    d => { const n = S.txns.filter(t => t.cat === c.id).length; if (confirm(n ? `Delete "${c.name}"? ${n} expense${n === 1 ? "" : "s"} will show as Uncategorised.` : `Delete "${c.name}"?`)) { S.cats = S.cats.filter(x => x.id !== c.id); S.budgets.forEach(b => { if (b.cats) b.cats = b.cats.filter(x => x !== c.id); }); save(); d.close(); render(); } });
}
function budgetDialog(b) {
  const edit = !!b; b = b ? { ...b, cats: [...(b.cats || [])] } : { id: uid(), name: "", amount: "", cats: [] };
  const d = sheet(`<form><h3>${edit ? "Edit budget" : "New budget"}</h3>
    <label class="f">Name<input class="in" id="n" required value="${esc(b.name)}" placeholder="e.g. Total trip, Food"></label>
    <label class="f">Limit (₹)<input class="in" id="a" type="number" step="any" min="1" required value="${esc(b.amount)}" placeholder="0"></label>
    <div class="f">Categories <span style="text-transform:none;font-weight:400">(none selected = all expenses)</span></div><div class="cg" id="cg"></div>${footer(edit)}</form>`);
  const draw = () => { $("#cg").innerHTML = S.cats.map(c => `<button type="button" data-c="${esc(c.id)}" class="${b.cats.includes(c.id) ? "on" : ""}">${bub(c, 1)}<span>${esc(c.name)}</span></button>`).join(""); };
  draw();
  $("#cg").onclick = e => { const x = e.target.closest("[data-c]"); if (x) { const i = b.cats.indexOf(x.dataset.c); i < 0 ? b.cats.push(x.dataset.c) : b.cats.splice(i, 1); draw(); } };
  $("#x", d).onclick = () => d.close();
  if (edit) $("#del", d).onclick = () => { if (confirm(`Delete budget "${b.name}"?`)) { S.budgets = S.budgets.filter(x => x.id !== b.id); save(); d.close(); render(); } };
  $("form", d).onsubmit = e => {
    e.preventDefault(); b.name = $("#n").value.trim(); b.amount = parseFloat($("#a").value) || 0;
    if (edit) { const i = S.budgets.findIndex(x => x.id === b.id); S.budgets[i] = { ...S.budgets[i], ...b }; } else S.budgets.push(b);
    save(); d.close(); render();
  };
  d.showModal();
}

/* ---------- boot ---------- */
render();
initCloud();
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
